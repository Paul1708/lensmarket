quarkus.application.name=image-service
quarkus.http.host=0.0.0.0
quarkus.rest.path=/images
quarkus.http.limits.max-form-attribute-size=11M
%dev.quarkus.rest.path=/
%test.quarkus.rest.path=/images
%test.quarkus.http.test-port=0
lensmarket.auth.jwt-secret=${LENSMARKET_JWT_SECRET}
%dev.lensmarket.auth.jwt-secret=${LENSMARKET_JWT_SECRET:local-development-only-jwt-secret-change-me}
%test.lensmarket.auth.jwt-secret=test-only-jwt-secret-with-at-least-32-bytes
lensmarket.auth.jwt-issuer=${LENSMARKET_JWT_ISSUER:lensmarket-auth}
lensmarket.auth.jwt-audience=${LENSMARKET_JWT_AUDIENCE:lensmarket-services}
quarkus.rest-client.listing-service.url=${LISTING_SERVICE_URL:http://listing-service:8080/listings}
quarkus.rest-client.listing-service.connect-timeout=${LENSMARKET_HTTP_CONNECT_TIMEOUT_MS:1000}
quarkus.rest-client.listing-service.read-timeout=${LENSMARKET_HTTP_REQUEST_TIMEOUT_MS:2000}
quarkus.datasource.db-kind=postgresql
# Explizite Pool-Größen: 20 reaktive Verbindungen pro Instanz, JDBC nur für Flyway.
quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.max-size=2
quarkus.hibernate-orm.schema-management.strategy=validate
# Docker Compose setzt JDBC- und Reactive-URL sowie Zugangsdaten passend zur Service-Datenbank.
quarkus.flyway.migrate-at-start=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.datasource.jdbc.telemetry=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId},spanId=%X{spanId},sampled=%X{sampled} [%c{2.}] (%t) %s%e%n
%test.quarkus.otel.sdk.disabled=true
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}

mp.messaging.outgoing.image-uploaded-out.connector=smallrye-kafka
mp.messaging.outgoing.image-uploaded-out.topic=image-uploaded
mp.messaging.outgoing.image-uploaded-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.image-watermarked-out.connector=smallrye-kafka
mp.messaging.outgoing.image-watermarked-out.topic=image-watermarked
mp.messaging.outgoing.image-watermarked-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.listing-deleted-in.connector=smallrye-kafka
mp.messaging.incoming.listing-deleted-in.topic=listing-deleted
mp.messaging.incoming.listing-deleted-in.group.id=image-service
mp.messaging.incoming.listing-deleted-in.auto.offset.reset=latest
mp.messaging.incoming.listing-deleted-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.listing-deleted-in.dead-letter-queue.topic=listing-deleted-dlq
mp.messaging.incoming.listing-deleted-in.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.incoming.listing-deleted-in.value.deserializer=lensmarket.image.events.ListingDeletedEventDeserializer

%test.mp.messaging.outgoing.image-uploaded-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.image-watermarked-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.listing-deleted-in.connector=smallrye-in-memory
%test.quarkus.kafka.devservices.enabled=false

# Transactional Outbox und periodische Storage-Konsistenzprüfung.
lensmarket.outbox.relay.interval=${LENSMARKET_OUTBOX_RELAY_INTERVAL:1s}
lensmarket.outbox.relay.batch-size=${LENSMARKET_OUTBOX_BATCH_SIZE:50}
lensmarket.storage.orphan-scan.interval=${LENSMARKET_ORPHAN_SCAN_INTERVAL:1m}
%test.lensmarket.outbox.relay.interval=off
%test.lensmarket.storage.orphan-scan.interval=off

lensmarket.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
lensmarket.minio.access-key=${MINIO_ACCESS_KEY}
lensmarket.minio.secret-key=${MINIO_SECRET_KEY}
%dev.lensmarket.minio.access-key=${MINIO_ACCESS_KEY:local-development}
%dev.lensmarket.minio.secret-key=${MINIO_SECRET_KEY:local-development-only-minio-secret}
%test.lensmarket.minio.access-key=test-only-access-key
%test.lensmarket.minio.secret-key=test-only-minio-secret
lensmarket.minio.bucket=${MINIO_BUCKET:lensmarket}
lensmarket.watermark.text=© LensMarket
lensmarket.watermark.opacity=0.7
lensmarket.watermark.max-dimension=1600
lensmarket.watermark.output-quality=0.8

# OpenAPI-Contract wird aus den Annotationen in resources/*.kt generiert und unter
# docs/openapi/ committet. Relativer Pfad loest gegen das Modulverzeichnis auf, daher "../".
quarkus.smallrye-openapi.store-schema-directory=../docs/openapi
quarkus.smallrye-openapi.store-schema-file-name=image-service.openapi
