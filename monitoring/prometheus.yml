global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DNS-Service-Discovery statt statischer Targets: bei --scale werden so
  # alle Instanzen eines Services gescraped, nicht nur eine zufällige.
  - job_name: lensmarket-services
    metrics_path: /q/metrics
    dns_sd_configs:
      - names:
          - user-service
          - listing-service
          - image-service
          - messaging-service
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: lensmarket-databases
    metrics_path: /metrics
    static_configs:
      - targets:
          - listing-db-exporter:9187
        labels:
          db_role: listing

  - job_name: lensmarket-infrastructure
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - cadvisor:8080

  - job_name: prometheus
    metrics_path: /prom/metrics
    static_configs:
      - targets:
          - prom:9090
