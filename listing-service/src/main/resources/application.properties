quarkus.application.name=listing-service
quarkus.http.host=0.0.0.0
quarkus.rest.path=/listings
quarkus.jackson.fail-on-unknown-properties=true
%dev.quarkus.rest.path=/
%test.quarkus.rest.path=/listings
%test.quarkus.http.test-port=0
lensmarket.auth.jwt-secret=${LENSMARKET_JWT_SECRET}
%dev.lensmarket.auth.jwt-secret=${LENSMARKET_JWT_SECRET:local-development-only-jwt-secret-change-me}
%test.lensmarket.auth.jwt-secret=test-only-jwt-secret-with-at-least-32-bytes
lensmarket.auth.jwt-issuer=${LENSMARKET_JWT_ISSUER:lensmarket-auth}
lensmarket.auth.jwt-audience=${LENSMARKET_JWT_AUDIENCE:lensmarket-services}
quarkus.datasource.db-kind=postgresql
# Explizite Pool-Größen: 20 reaktive Verbindungen pro Instanz, JDBC nur für Flyway.
# Budget: 22 Verbindungen je Instanz; 4 Instanzen = 88 < max_connections=200.
quarkus.datasource.reactive.max-size=20
quarkus.datasource.jdbc.max-size=2
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.packages=lensmarket.listing.data.entity

# Docker Compose setzt JDBC- und Reactive-URL sowie Zugangsdaten passend zur Service-Datenbank.
quarkus.flyway.migrate-at-start=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.datasource.jdbc.telemetry=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId},spanId=%X{spanId},sampled=%X{sampled} [%c{2.}] (%t) %s%e%n
%test.quarkus.otel.sdk.disabled=true
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}

mp.messaging.outgoing.listing-created-out.connector=smallrye-kafka
mp.messaging.outgoing.listing-created-out.topic=listing-created
mp.messaging.outgoing.listing-created-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.listing-status-changed-out.connector=smallrye-kafka
mp.messaging.outgoing.listing-status-changed-out.topic=listing-status-changed
mp.messaging.outgoing.listing-status-changed-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.listing-deleted-out.connector=smallrye-kafka
mp.messaging.outgoing.listing-deleted-out.topic=listing-deleted
mp.messaging.outgoing.listing-deleted-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.incoming.image-watermarked-in.connector=smallrye-kafka
mp.messaging.incoming.image-watermarked-in.topic=image-watermarked
mp.messaging.incoming.image-watermarked-in.group.id=listing-service
mp.messaging.incoming.image-watermarked-in.auto.offset.reset=latest
mp.messaging.incoming.image-watermarked-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.image-watermarked-in.dead-letter-queue.topic=image-watermarked-dlq
mp.messaging.incoming.image-watermarked-in.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.incoming.image-watermarked-in.value.deserializer=lensmarket.listing.events.ImageWatermarkedEventDeserializer

%test.mp.messaging.outgoing.listing-created-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.listing-status-changed-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.listing-deleted-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.image-watermarked-in.connector=smallrye-in-memory
%test.quarkus.kafka.devservices.enabled=false

# Transactional-Outbox-Relay. In Tests wird es gezielt manuell ausgelöst.
lensmarket.outbox.relay.interval=${LENSMARKET_OUTBOX_RELAY_INTERVAL:1s}
lensmarket.outbox.relay.batch-size=${LENSMARKET_OUTBOX_BATCH_SIZE:50}
%test.lensmarket.outbox.relay.interval=off

# OpenAPI-Contract wird aus den Annotationen in resources/*.kt generiert und unter
# docs/openapi/ committet. Relativer Pfad loest gegen das Modulverzeichnis auf, daher "../".
quarkus.smallrye-openapi.store-schema-directory=../docs/openapi
quarkus.smallrye-openapi.store-schema-file-name=listing-service.openapi
