name: ${COMPOSE_PROJECT_NAME:-cc_lensmarket}

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  gateway:
    image: traefik:3.7.0
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=traefik
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
    ports:
      - "8081:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowheaders=Authorization,Content-Type,Idempotency-Key"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=86400"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.burst=5"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS:?Set TRAEFIK_DASHBOARD_USERS in .env}"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      - "traefik.http.routers.dashboard.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
      - --set
      - redpanda.auto_create_topics_enabled=true
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  user-db:
    image: postgres:16.13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lensmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: users
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - user-db-data:/var/lib/postgresql/data

  listing-db:
    image: postgres:16.13
    # max_connections=200: Headroom für skalierte listing-service-Instanzen
    # (20 reactive + 2 JDBC je Instanz) plus postgres_exporter.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lensmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: listings
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - listing-db-data:/var/lib/postgresql/data

  image-db:
    image: postgres:16.13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lensmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: images
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - image-db-data:/var/lib/postgresql/data

  messaging-db:
    image: postgres:16.13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lensmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: messages
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - messaging-db-data:/var/lib/postgresql/data

  user-service:
    build:
      context: ./user-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://user-db:5432/users
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://user-db:5432/users
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-lensmarket}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LENSMARKET_JWT_SECRET: ${LENSMARKET_JWT_SECRET:?Set LENSMARKET_JWT_SECRET in .env}
      LENSMARKET_JWT_ISSUER: ${LENSMARKET_JWT_ISSUER:-lensmarket-auth}
      LENSMARKET_JWT_AUDIENCE: ${LENSMARKET_JWT_AUDIENCE:-lensmarket-services}
      LENSMARKET_TOKEN_TTL_SECONDS: ${LENSMARKET_TOKEN_TTL_SECONDS:-7200}
      QUARKUS_OTEL_SDK_DISABLED: ${QUARKUS_OTEL_SDK_DISABLED:-true}
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-service.entrypoints=web"
      - "traefik.http.routers.user-service.rule=PathPrefix(`/users`)"
      - "traefik.http.routers.user-service.middlewares=cors@docker"
      - "traefik.http.routers.user-service.service=user-service"
      - "traefik.http.services.user-service.loadbalancer.server.port=8080"
      - "traefik.http.routers.user-login.entrypoints=web"
      - "traefik.http.routers.user-login.rule=PathPrefix(`/users/login`)"
      - "traefik.http.routers.user-login.priority=30"
      - "traefik.http.routers.user-login.middlewares=cors@docker,login-ratelimit@docker"
      - "traefik.http.routers.user-login.service=user-service"
      - "traefik.http.routers.user-register.entrypoints=web"
      - "traefik.http.routers.user-register.rule=PathPrefix(`/users`) && Method(`POST`)"
      - "traefik.http.routers.user-register.priority=25"
      - "traefik.http.routers.user-register.middlewares=cors@docker,login-ratelimit@docker"
      - "traefik.http.routers.user-register.service=user-service"

  listing-service:
    build:
      context: ./listing-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://listing-db:5432/listings
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://listing-db:5432/listings
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-lensmarket}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      LENSMARKET_JWT_SECRET: ${LENSMARKET_JWT_SECRET:?Set LENSMARKET_JWT_SECRET in .env}
      LENSMARKET_JWT_ISSUER: ${LENSMARKET_JWT_ISSUER:-lensmarket-auth}
      LENSMARKET_JWT_AUDIENCE: ${LENSMARKET_JWT_AUDIENCE:-lensmarket-services}
      LENSMARKET_OUTBOX_RELAY_INTERVAL: ${LENSMARKET_OUTBOX_RELAY_INTERVAL:-1s}
      LENSMARKET_OUTBOX_BATCH_SIZE: ${LENSMARKET_OUTBOX_BATCH_SIZE:-50}
      QUARKUS_OTEL_SDK_DISABLED: ${QUARKUS_OTEL_SDK_DISABLED:-true}
    depends_on:
      redpanda:
        condition: service_healthy
      listing-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.listing-service.entrypoints=web"
      - "traefik.http.routers.listing-service.rule=PathPrefix(`/listings`)"
      - "traefik.http.routers.listing-service.middlewares=cors@docker"
      - "traefik.http.services.listing-service.loadbalancer.server.port=8080"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lensmarket}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  image-service:
    build:
      context: ./image-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://image-db:5432/images
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://image-db:5432/images
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-lensmarket}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      LENSMARKET_JWT_SECRET: ${LENSMARKET_JWT_SECRET:?Set LENSMARKET_JWT_SECRET in .env}
      LENSMARKET_JWT_ISSUER: ${LENSMARKET_JWT_ISSUER:-lensmarket-auth}
      LENSMARKET_JWT_AUDIENCE: ${LENSMARKET_JWT_AUDIENCE:-lensmarket-services}
      LENSMARKET_HTTP_CONNECT_TIMEOUT_MS: ${LENSMARKET_HTTP_CONNECT_TIMEOUT_MS:-1000}
      LENSMARKET_HTTP_REQUEST_TIMEOUT_MS: ${LENSMARKET_HTTP_REQUEST_TIMEOUT_MS:-2000}
      LENSMARKET_OUTBOX_RELAY_INTERVAL: ${LENSMARKET_OUTBOX_RELAY_INTERVAL:-1s}
      LENSMARKET_OUTBOX_BATCH_SIZE: ${LENSMARKET_OUTBOX_BATCH_SIZE:-50}
      LENSMARKET_ORPHAN_SCAN_INTERVAL: ${LENSMARKET_ORPHAN_SCAN_INTERVAL:-1m}
      QUARKUS_OTEL_SDK_DISABLED: ${QUARKUS_OTEL_SDK_DISABLED:-true}
      LISTING_SERVICE_URL: http://listing-service:8080/listings
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lensmarket}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      redpanda:
        condition: service_healthy
      image-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.image-service.entrypoints=web"
      - "traefik.http.routers.image-service.rule=PathPrefix(`/images`)"
      - "traefik.http.routers.image-service.middlewares=cors@docker"
      - "traefik.http.services.image-service.loadbalancer.server.port=8080"

  messaging-service:
    build:
      context: ./messaging-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://messaging-db:5432/messages
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://messaging-db:5432/messages
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-lensmarket}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      LENSMARKET_JWT_SECRET: ${LENSMARKET_JWT_SECRET:?Set LENSMARKET_JWT_SECRET in .env}
      LENSMARKET_JWT_ISSUER: ${LENSMARKET_JWT_ISSUER:-lensmarket-auth}
      LENSMARKET_JWT_AUDIENCE: ${LENSMARKET_JWT_AUDIENCE:-lensmarket-services}
      LENSMARKET_HTTP_CONNECT_TIMEOUT_MS: ${LENSMARKET_HTTP_CONNECT_TIMEOUT_MS:-1000}
      LENSMARKET_HTTP_REQUEST_TIMEOUT_MS: ${LENSMARKET_HTTP_REQUEST_TIMEOUT_MS:-2000}
      LENSMARKET_OUTBOX_RELAY_INTERVAL: ${LENSMARKET_OUTBOX_RELAY_INTERVAL:-1s}
      LENSMARKET_OUTBOX_BATCH_SIZE: ${LENSMARKET_OUTBOX_BATCH_SIZE:-50}
      QUARKUS_OTEL_SDK_DISABLED: ${QUARKUS_OTEL_SDK_DISABLED:-true}
      LISTING_SERVICE_URL: http://listing-service:8080/listings
    depends_on:
      redpanda:
        condition: service_healthy
      messaging-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.messaging-service.entrypoints=web"
      - "traefik.http.routers.messaging-service.rule=PathPrefix(`/messages`)"
      - "traefik.http.routers.messaging-service.middlewares=cors@docker"
      - "traefik.http.services.messaging-service.loadbalancer.server.port=8080"

volumes:
  redpanda-data:
  user-db-data:
  listing-db-data:
  image-db-data:
  messaging-db-data:
  minio-data:
